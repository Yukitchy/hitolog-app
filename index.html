<title>ヒトログ</title>

<style>
:root{--ai-deep:#173A4F;--gold:#D8B45A;--bg:#F4EFE3;--ink:#20272B;--sub:#5C6B72;--win:#0F1F30}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--win);border:2px solid var(--gold);border-radius:16px;padding:32px 28px;
 max-width:380px;width:100%;text-align:center;color:#E9EEF4}
.card h1{font-family:"Zen Kaku Gothic New",sans-serif;font-size:22px;font-weight:900;margin-bottom:6px}
.card p{font-size:13.5px;color:#9FB2C4;margin-bottom:18px;line-height:1.8}
.card input{width:100%;font-family:inherit;font-size:16px;padding:12px 16px;border-radius:12px;
 border:1px solid rgba(216,180,90,.45);background:rgba(255,255,255,.06);color:#E9EEF4;margin-bottom:10px;text-align:center}
.card input::placeholder{color:#7d8fa0}
.card button{width:100%;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;border:none;
 border-radius:999px;padding:13px;background:var(--gold);color:var(--win)}
.card .err{font-size:13.5px;color:#E8907F;min-height:1.4em;margin-top:10px}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style></head><body>

<script>
const P=JSON.parse(document.getElementById("payload").textContent);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=i=>document.getElementById(i);
async function open_(){
  const pw=$("pw").value;if(!pw)return;
  $("err").textContent="開いています…";$("go").disabled=true;
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.ct));
    try{sessionStorage.setItem("hitolog-pw",pw)}catch(e){}
    // document.write だと中のスクリプトが動かないので iframe に流し込む
    const fr=document.createElement("iframe");
    fr.id="app";fr.title="ヒトログ";
    fr.srcdoc=new TextDecoder().decode(buf);
    document.body.replaceChildren(fr);
  }catch(e){
    $("err").textContent="合言葉が違います";$("go").disabled=false;$("pw").select();
  }
}
$("go").onclick=open_;
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")open_()});
$("pw").focus();
try{const s=sessionStorage.getItem("hitolog-pw");if(s){$("pw").value=s;open_()}}catch(e){}
</script></body></html>
